<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subarna & Erfan | Our Story</title>
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap');
        
        body { 
            margin: 0; 
            background-color: #0f172a; 
            font-family: 'Inter', sans-serif;
            color: white;
            overflow-x: hidden;
        }

        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow { animation: spin-slow 8s linear infinite; }

        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #e11d48; border-radius: 10px; }
        
        /* Smooth transition for background colors */
        .bg-transition {
            transition: background 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [scrollY, setScrollY] = useState(0);
            const [isUnlocked, setIsUnlocked] = useState(false);
            const [revealedSecrets, setRevealedSecrets] = useState([]);

            useEffect(() => {
                let requestRunning = false;
                const handleScroll = () => {
                    if (!requestRunning) {
                        window.requestAnimationFrame(() => {
                            setScrollY(window.scrollY);
                            requestRunning = false;
                        });
                        requestRunning = true;
                    }
                };
                window.addEventListener('scroll', handleScroll, { passive: true });
                if (window.lucide) window.lucide.createIcons();
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [isUnlocked, revealedSecrets, scrollY]);

            const toggleSecret = (id) => {
                if (!revealedSecrets.includes(id)) {
                    setRevealedSecrets([...revealedSecrets, id]);
                }
            };

            const getTransform = (speed, offset = 0) => {
                const y = (scrollY - offset) * speed;
                return `translateY(${y}px)`;
            };

            // Enhanced background logic for more responsive color changes
            const getBgGradient = () => {
                if (scrollY < 800) return 'linear-gradient(to bottom, #0f172a 0%, #1e1b4b 100%)';
                if (scrollY < 2200) return 'linear-gradient(to bottom, #312e81 0%, #020617 100%)';
                if (scrollY < 3800) return 'linear-gradient(to bottom, #1e1b4b 0%, #000000 100%)';
                return 'linear-gradient(to bottom, #020617 0%, #000000 100%)';
            };

            return (
                <div className="min-h-[550vh] bg-slate-950 text-white selection:bg-rose-500/30 font-sans overflow-x-hidden">
                    
                    {/* Background Depth Engine */}
                    <div 
                        className="fixed inset-0 pointer-events-none z-0 bg-transition"
                        style={{ background: getBgGradient() }}
                    />

                    {/* Hero Section */}
                    <section className="relative h-screen flex flex-col items-center justify-center z-10 px-4">
                        <div 
                            style={{ transform: getTransform(0.3) }}
                            className="relative text-center w-full max-w-4xl group"
                        >
                            <div className="absolute -top-16 left-1/2 -translate-x-1/2 flex justify-center gap-8 md:gap-12 pointer-events-none opacity-50">
                                <i data-lucide="heart" className="w-5 h-5 md:w-6 md:h-6 text-rose-400 animate-bounce"></i>
                                <i data-lucide="sun" className="w-6 h-6 md:w-8 md:h-8 text-amber-200 animate-spin-slow"></i>
                                <i data-lucide="heart" className="w-5 h-5 md:w-6 md:h-6 text-rose-400 animate-bounce" style={{animationDelay: '0.3s'}}></i>
                            </div>

                            <div className="mb-4">
                                <span className="text-[10px] md:text-xs tracking-[0.4em] md:tracking-[0.6em] text-rose-300/60 font-medium uppercase">A Story Written on Sundays</span>
                            </div>

                            <div className="relative flex flex-col items-center">
                                {/* Fixed Overlapping: Adjusted responsive text sizes and margins */}
                                <h1 className="text-5xl sm:text-7xl md:text-9xl font-black tracking-tighter leading-tight md:leading-none">
                                    <span className="block bg-clip-text text-transparent bg-gradient-to-r from-rose-200 via-white to-rose-100 drop-shadow-sm">
                                        SUBARNA
                                    </span>
                                    <div className="flex items-center justify-center my-4 md:my-2 gap-3 md:gap-4">
                                        <div className="h-[1px] w-8 sm:w-12 md:w-24 bg-gradient-to-r from-transparent to-rose-400/50" />
                                        <i data-lucide="heart" className="w-6 h-6 md:w-12 md:h-12 text-rose-500 fill-rose-500/20 animate-pulse"></i>
                                        <div className="h-[1px] w-8 sm:w-12 md:w-24 bg-gradient-to-l from-transparent to-blue-400/50" />
                                    </div>
                                    <span className="block bg-clip-text text-transparent bg-gradient-to-r from-blue-100 via-white to-blue-200 drop-shadow-sm">
                                        ERFAN
                                    </span>
                                </h1>
                                <div className="absolute inset-0 bg-rose-500/10 blur-[60px] md:blur-[100px] -z-10 rounded-full" />
                            </div>

                            <p className="mt-8 text-base md:text-xl font-light text-slate-400 max-w-lg mx-auto leading-relaxed px-4">
                                Every layer of this story was written by <span className="text-white font-medium italic">us</span>. 
                                A beautiful sequence of <span className="text-amber-200 font-semibold uppercase tracking-tighter">Sundays</span> that changed our lives.
                            </p>
                            
                            <div className="mt-12 md:mt-16 animate-bounce flex flex-col items-center gap-2 opacity-40 hover:opacity-100 transition-opacity">
                                <span className="text-[10px] tracking-[0.5em] font-bold uppercase">Start the Descent</span>
                                <i data-lucide="navigation" className="rotate-180 w-4 h-4"></i>
                            </div>
                        </div>
                    </section>

                    {/* Layer 1: Beginning */}
                    <section className="relative min-h-screen z-20 px-6 flex items-center">
                        <div 
                            className="max-w-2xl mx-auto bg-white/5 backdrop-blur-xl p-8 md:p-10 rounded-[2rem] border border-white/10 shadow-2xl"
                            style={{ transform: getTransform(-0.1, 800) }}
                        >
                            <div className="flex items-center gap-4 mb-6">
                                <div className="p-3 bg-blue-500/20 rounded-xl">
                                    <i data-lucide="sun" className="w-6 h-6 md:w-8 md:h-8 text-amber-400"></i>
                                </div>
                                <div>
                                    <p className="text-blue-400 font-mono text-xs md:text-sm uppercase tracking-wider">Sunday • October 26, 2025</p>
                                    <h2 className="text-2xl md:text-3xl font-bold">The First "Hello"</h2>
                                </div>
                            </div>
                            <p className="text-base md:text-lg text-slate-300 leading-relaxed italic">
                                "It all started on a quiet Sunday. I reached out for the first time, 
                                not knowing that this specific Sunday would become the foundation of everything."
                            </p>
                        </div>
                    </section>

                    {/* Layer 2: Meeting */}
                    <section className="relative min-h-screen z-20 px-6 flex items-center justify-end">
                        <div 
                            className="max-w-2xl mx-auto md:mr-20 bg-white/5 backdrop-blur-xl p-8 md:p-10 rounded-[2rem] border border-white/10 shadow-2xl"
                            style={{ transform: getTransform(-0.08, 1800) }}
                        >
                            <div className="flex items-center gap-4 mb-6">
                                <div className="p-3 bg-rose-500/20 rounded-xl">
                                    <i data-lucide="eye" className="w-6 h-6 md:w-8 md:h-8 text-rose-400"></i>
                                </div>
                                <div>
                                    <p className="text-rose-400 font-mono text-xs md:text-sm uppercase tracking-wider">Sunday • November 02, 2025</p>
                                    <h2 className="text-2xl md:text-3xl font-bold">Face to Face</h2>
                                </div>
                            </div>
                            <p className="text-base md:text-lg text-slate-300 leading-relaxed italic">
                                "Exactly one week later, another Sunday brought us together in person. 
                                Seeing you standing there, Subarna, confirmed what that first Sunday hinted at."
                            </p>
                            <div className="mt-4 flex items-center gap-2 text-rose-300/60 text-xs">
                                <i data-lucide="map-pin" className="w-3 h-3"></i>
                                <span>The second Sunday of our destiny.</span>
                            </div>
                        </div>
                    </section>

                    {/* Layer 3: Secrets */}
                    <section className="relative min-h-screen z-30 flex items-center justify-center py-20">
                        <div className="max-w-3xl w-full px-6 text-center">
                            <i data-lucide="anchor" className="w-10 h-10 md:w-12 md:h-12 text-indigo-400 mb-8 mx-auto animate-pulse"></i>
                            <h2 className="text-3xl md:text-4xl font-black mb-10 md:mb-12 uppercase tracking-tighter">Things I only tell you...</h2>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                                {[
                                    { id: 1, hint: "Why I call you 'Baby'...", msg: "Because you're my most precious person, someone I want to protect and cherish every single second." },
                                    { id: 2, hint: "The 'Sunday' Connection...", msg: "Did you realize? Every major milestone—our first text, our first meeting, and our proposal—all happened on a Sunday." },
                                    { id: 3, hint: "A secret about Nov 2nd...", msg: "I was so nervous my hands were shaking before I saw you. I kept checking my hair every 30 seconds!" },
                                    { id: 4, hint: "When you call me 'Baby'...", msg: "My heart actually skips a beat. It's my favorite sound in the world, hearing that coming from you." },
                                ].map((secret) => (
                                    <button
                                        key={secret.id}
                                        onClick={() => toggleSecret(secret.id)}
                                        className={`group p-6 md:p-8 rounded-3xl transition-all duration-700 border text-left
                                          ${revealedSecrets.includes(secret.id) 
                                            ? 'bg-indigo-600/20 border-indigo-400/50 scale-[1.02] shadow-lg' 
                                            : 'bg-white/5 border-white/10 hover:bg-white/10'}`}
                                    >
                                        {!revealedSecrets.includes(secret.id) ? (
                                            <div className="flex justify-between items-center opacity-60 group-hover:opacity-100">
                                                <span className="font-semibold text-indigo-200 text-sm md:text-base">{secret.hint}</span>
                                                <i data-lucide="lock" className="w-4 h-4"></i>
                                            </div>
                                        ) : (
                                            <p className="text-white text-sm md:text-base font-medium leading-relaxed italic animate-in fade-in">"{secret.msg}"</p>
                                        )}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Layer 4: Proposal */}
                    <section className="relative min-h-screen py-32 z-40 flex items-center justify-center px-4">
                        <div className="absolute w-[300px] md:w-[800px] h-[300px] md:h-[800px] bg-rose-600/10 rounded-full blur-[100px] md:blur-[160px] animate-pulse pointer-events-none" />
                        
                        <div className="relative z-10 text-center max-w-2xl w-full">
                            {!isUnlocked ? (
                                <div className="space-y-8 flex flex-col items-center">
                                    <div 
                                        className="w-24 h-24 md:w-28 md:h-28 rounded-full bg-gradient-to-tr from-rose-600 to-pink-400 flex items-center justify-center shadow-[0_0_60px_rgba(225,29,72,0.5)] cursor-pointer hover:scale-110 active:scale-95 transition-all duration-300"
                                        onClick={() => setIsUnlocked(true)}
                                    >
                                        <i data-lucide="unlock" className="w-8 h-8 md:w-10 md:h-10 text-white"></i>
                                    </div>
                                    <div className="bg-white/5 p-6 rounded-2xl backdrop-blur-sm border border-white/10">
                                        <h3 className="text-xl md:text-2xl font-bold mb-2 uppercase tracking-tighter">December 07, 2025</h3>
                                        <p className="text-slate-400 text-sm md:text-base italic">The day I asked for your 'Forever'. Click the lock to open my heart.</p>
                                    </div>
                                </div>
                            ) : (
                                <div className="animate-in fade-in zoom-in-95 duration-1000 flex flex-col items-center w-full">
                                    <div className="h-24 md:h-32 flex items-center justify-center mb-6 md:mb-8 relative">
                                        <i data-lucide="heart" className="w-16 h-16 md:w-24 md:h-24 text-rose-500 fill-rose-500 animate-bounce relative z-10"></i>
                                        <div className="absolute inset-0 bg-rose-500/20 blur-2xl rounded-full scale-150 animate-pulse" />
                                    </div>

                                    <h2 className="text-4xl md:text-6xl font-black mb-6 md:mb-8 bg-clip-text text-transparent bg-gradient-to-b from-white to-rose-200 uppercase tracking-tighter">
                                        Subarna Sultana,
                                    </h2>
                                    
                                    <div className="bg-white/5 backdrop-blur-xl p-6 md:p-12 rounded-[2rem] md:rounded-[3rem] border border-white/20 text-base md:text-xl leading-relaxed text-slate-100 shadow-2xl relative w-full text-center">
                                        <p className="mb-4 md:mb-6 font-medium">
                                            From the first text on 26th October to seeing you on 2nd November, 
                                            every moment led to 7th December—the day I promised you everything.
                                        </p>
                                        <p className="font-serif italic text-xl md:text-3xl text-rose-300">
                                            "I love you, Baby. Not just for who you are, but for who I am when I'm with you."
                                        </p>
                                        <div className="mt-8 pt-8 border-t border-white/10 flex flex-col items-center">
                                            <span className="text-[10px] md:text-xs uppercase tracking-widest text-slate-500 mb-2 font-bold">Signed with love</span>
                                            <span className="text-2xl md:text-3xl font-black tracking-tighter uppercase">Sarkar Erfan Uhana</span>
                                        </div>
                                    </div>

                                    <button 
                                        onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                                        className="mt-12 group flex items-center gap-2 mx-auto text-slate-400 hover:text-white transition-colors text-sm"
                                    >
                                        <i data-lucide="navigation" className="w-3 h-3 rotate-0 group-hover:-translate-y-1 transition-transform"></i>
                                        <span>Back to the start</span>
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* Ambient Particles */}
                        <div className="absolute inset-0 pointer-events-none overflow-hidden">
                            {[...Array(20)].map((_, i) => (
                                <div
                                    key={i}
                                    className="absolute text-white/20 animate-pulse"
                                    style={{
                                        top: `${Math.random() * 100}%`,
                                        left: `${Math.random() * 100}%`,
                                        animationDelay: `${Math.random() * 5}s`,
                                    }}
                                >
                                    <div className="w-1 h-1 bg-white rounded-full" />
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Side Navigation Dots - Responsive Positioning */}
                    <div className="fixed left-4 md:left-8 top-1/2 -translate-y-1/2 flex flex-col gap-4 md:gap-6 z-50">
                        {[
                            { label: 'Start', icon: 'navigation' },
                            { label: 'Oct 26', icon: 'message-circle' },
                            { label: 'Nov 02', icon: 'eye' },
                            { label: 'Dec 07', icon: 'heart' }
                        ].map((item, idx) => {
                            const sectionHeight = document.body.scrollHeight / 5;
                            // More accurate isActive check
                            const isActive = Math.min(Math.floor((scrollY + window.innerHeight / 3) / sectionHeight), 3) === idx;
                            return (
                                <div key={idx} className="group flex items-center gap-3 md:gap-4 cursor-pointer">
                                    <div className={`w-2 h-2 md:w-3 md:h-3 rounded-full transition-all duration-300 border ${isActive ? 'bg-rose-500 border-rose-400 scale-125 md:scale-150 shadow-[0_0_10px_rgba(244,63,94,0.8)]' : 'bg-white/20 border-transparent'}`} />
                                    <span className={`text-[8px] md:text-[10px] uppercase tracking-widest transition-opacity duration-300 hidden md:block ${isActive ? 'opacity-100 font-bold' : 'opacity-0 group-hover:opacity-100'}`}>
                                        {item.label}
                                    </span>
                                </div>
                            );
                        })}
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
